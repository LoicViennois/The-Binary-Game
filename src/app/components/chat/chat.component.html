@if (connected) {
  <div class="d-flex flex-column h-100">
    <h3>Chat</h3>
    <div class="d-flex flex-grow-1 flex-column-reverse overflow-auto px-1">
      @for (msg of messagesService.messages | async; track msg.timestamp) {
        <bin-message [message]="msg"></bin-message>
      }
    </div>
    <div class="px-1 margin-left">
      <form (ngSubmit)="onSubmit()" [formGroup]="form">
        <div class="form-group m-0">
          <div class="input-group">
            <input #message
              autocomplete="off"
              class="form-control"
              formControlName="message"
              id="message"
              placeholder="Message"
              type="text">
              <label for="message"></label>
              <div class="input-group-append">
                <button [disabled]="form.invalid"
                  class="btn btn-light px-3"
                  type="submit">
                  <i class="fas fa-paper-plane pr-1"></i>
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  }
