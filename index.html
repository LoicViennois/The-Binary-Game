<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Binary Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/favicon.64.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#d9d5c9" />
    <meta name="description" content="The Binary Game - Puzzle and math challenge with binary numbers" />

    <!-- Theme Initialization (Dark mode by default) -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('tb_theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Matomo -->
    <script>
      let _paq = window._paq = window._paq || [];
      _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        let u = "https://matomo.loicviennois.com/";
        _paq.push(['setTrackerUrl', u + 'matomo.php']);
        _paq.push(['setSiteId', '4']);
        let d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];
        g.async = true; g.src = u + 'matomo.js'; s.parentNode.insertBefore(g, s);
      })();
    </script>
    <!-- End Matomo Code -->
  </head>
  <body class="min-h-screen bg-stone-100/90 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors">
    <div id="root"></div>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
